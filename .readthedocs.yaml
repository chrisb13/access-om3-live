# Read the Docs builds a preview of every pull request (the real site is published by .github/workflows/live.yml to GitHub Pages).
# The preview has everything except the OM3 Monitor's results, which need the nightly Gadi run.
# See https://docs.readthedocs.com/platform/stable/pull-requests.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Only pull requests (version type "external") are built; cancel anything else (exit code 183 cancels a build)
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" != "external" ]; then exit 183; fi
    install:
      - pip install -r requirements.txt
    build:
      html:
        - SITE_URL="$READTHEDOCS_CANONICAL_URL" bash scripts/build_preview.sh "$READTHEDOCS_OUTPUT/html"
