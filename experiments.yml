# Experiments shown under "OM3 Monitor" on the website. Add or remove an entry to bring a
# run in or out of focus. The keys match the sections of each experiment's status page:
#   archive    (required) full path to the run's archive folder (holding output000, ...): the
#              payu archive on /scratch or its synced copy on /g/data. Its folder name is the
#              experiment's name on the site, so it must be unique.
#   run_dir    (optional) the payu control directory, for the current or crashed run's logs.
#   notebooks  (optional) extra notebooks for this experiment, on top of `notebooks` below.
#   description (optional) one line for the OM3 Monitor table and the status page; without
#              it, the first line of the description in the run's metadata.yaml is used.
# An entry with just the archive folder can be written as a plain path:
#   - /g/data/ol01/outputs/access-om3-25km/MC_25km_jra_iaf+wombatlite-test4-d28e0359
#   - archive: /g/data/ol01/outputs/access-om3-8km/MC_8km_jra_ryf-test2-expt-c349f800
#     run_dir: /g/data/tm70/cyb561/access-om3-runs/8k/MC_8km_jra_ryf-test2
#     notebooks: [MLD, SST]
#     description: One line on what this run is testing
experiments:
  - /g/data/ol01/outputs/access-om3-25km/MC_25km_jra_iaf+wombatlite-test4-d28e0359
  - archive: /g/data/ol01/outputs/access-om3-8km/MC_8km_jra_ryf-test2-expt-c349f800
    run_dir: /g/data/tm70/cyb561/access-om3-runs/8k/MC_8km_jra_ryf-test2
    description: 8km jra_ryf-test2
  - archive: /scratch/tm70/cyb561/access-om3/archive/MC_8km_jra_ryf-test1-expt-4f2841fe
    run_dir: /g/data/tm70/cyb561/access-om3-runs/8k/MC_8km_jra_ryf-test1
    description: 8km jra_ryf-test1
  - /g/data/ol01/outputs/access-om3-100km/MC_100km_jra_iaf+wombatlite-test1-e1de2a94
  - archive: /scratch/tm70/ek4684/access-om3/archive/test1-MCW_100km_era_iaf-908e8682
    run_dir: /scratch/tm70/ek4684/test1
    description: MCW beta long-run
  - /scratch/tm70/hm6113/access-om3/archive/exp2.0_run2-expt-3d030595
  - archive: /scratch/x77/aek156/access-om3/archive/MC_25km_jra_iaf+wombatlite-test5-38867fcd
    description: 25km JRA IAF test 5 (stopped)
  - archive: /scratch/x77/aek156/access-om3/archive/MC_25km_era_iaf+wombatlite-test5-era-8a51ed1d
    run_dir: /home/156/aek156/payu/MC_25km_era_iaf+wombatlite
    description: 25km ERA IAF test 5 (stopped)

# Notebooks run for every experiment, from this access-om3-paper-1 git ref.
# (pull/137/head until PR #137, which adds ocean_stats, is merged; then main.)
paper_ref: pull/137/head
notebooks:
  - ocean_stats
  - timeseries
  - Timeseries_daily_extreme_from_2D_fields
  - temp-salt-vs-depth-time

# PBS settings for the nightly job.
project: tm70
# What the notebooks always need: xp65 (conda environment) and ik11 (the ACCESS-OM2 run
# that timeseries compares against). Each run's own /g/data or /scratch project is added
# automatically; add any project that extra notebooks read from.
storage: gdata/xp65+gdata/ik11
conda_module: conda/analysis3-26.08
