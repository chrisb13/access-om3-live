# Notebooks run for every experiment, from this access-om3-paper-1 commit (a full hash, so
# nothing changes until it is updated here): PR #137's head, rebased onto main on 2026-10-17.
# Once PR #137 is merged, use the merge commit on main.
paper_ref: d2a7f468b45ae5629e3c6af59935c6e9aa4a2dd2
notebooks:
  - ocean_stats
  - timeseries
  - Timeseries_daily_extreme_from_2D_fields
  - temp-salt-vs-depth-time
  - SeaIce_area 

# PBS settings for the nightly job.
project: tm70
# What the notebooks always need: xp65 (conda environment) and ik11 (the ACCESS-OM2 run
# that timeseries compares against). Each run's own /g/data or /scratch project is added
# automatically; add any project that an experiment's own notebooks read from.
storage: gdata/xp65+gdata/ik11+gdata/av17
conda_module: conda/analysis3-26.08
