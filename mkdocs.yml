# Theme settings copied from access-om3-paper-1/documentation/mkdocs.yml; theme files
# (overrides/, assets/, css/, fontello/) are fetched from that repo at build time.
# Nav is generated by scripts/build_site.py into build/mkdocs.yml, which inherits this file.
site_name: ACCESS-OM3 live evaluation
site_url: !ENV [SITE_URL, "https://access-nri.github.io/access-om3-live/"]
repo_url: https://github.com/ACCESS-NRI/access-om3-live/
repo_name: access-om3-live

theme:
  name: material
  custom_dir: overrides   # relative to build/mkdocs.yml
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: custom-light
      primary: none
      accent: none
      toggle:
        icon: material/theme-light-dark
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: none
      accent: none
      scheme: custom-dark
      toggle:
        icon: material/theme-light-dark
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  logo: assets/ACCESS_icon_HIVE.png
  favicon: assets/ACCESS_icon_HIVE.png
copyright: Copyright &copy; 2025 ACCESS-NRI

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
      include:
        - "**/*.ipynb"

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      title: On this page

extra:
  generator: false
  social:
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/access-nri.bsky.social
      name: ACCESS-NRI on Bluesky
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/access-nri
      name: ACCESS-NRI on Linkedin

extra_css:
  - "https://fonts.googleapis.com/icon?family=Material+Icons"
  - fontello/css/fontello-codes.css
  - fontello/css/fontello-ie7-codes.css
  - fontello/css/fontello-ie7.css
  - fontello/css/fontello.css
  - css/custom.css
